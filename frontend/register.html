<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Your Venue Account - Jukebox VIP</title>
  <meta name="description" content="Register your venue to start taking guest song requests and priority boosts." />

  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <div class="auth-page-wrapper">
    <div class="glass-card auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="logo-icon" style="font-size: 2rem;">🎵</div>
        <h1 class="gradient-text" style="font-size: 1.6rem; margin-top: 8px;">Create Your Venue</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Start taking guest song requests in a minute.</p>
      </div>

      <div id="form-error" class="auth-error"></div>

      <form id="register-form">
        <div class="auth-form-group">
          <label for="venue-name">Venue Name</label>
          <input id="venue-name" class="auth-input" type="text" placeholder="The Blue Note" required autocomplete="organization" />
        </div>
        <div class="auth-form-group">
          <label for="email">Email</label>
          <input id="email" class="auth-input" type="email" placeholder="owner@yourvenue.com" required autocomplete="email" />
        </div>
        <div class="auth-form-group">
          <label for="password">Password</label>
          <input id="password" class="auth-input" type="password" placeholder="At least 8 characters" minlength="8" required autocomplete="new-password" />
        </div>
        <button id="submit-btn" type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create Account</button>
      </form>

      <div class="auth-switch-link">
        Already have an account? <a href="/login">Log in</a>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('form-error');
      const submitBtn = document.getElementById('submit-btn');
      errorEl.classList.remove('visible');

      const payload = {
        venue_name: document.getElementById('venue-name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/dashboard';
        } else {
          errorEl.textContent = data.detail || 'Registration failed.';
          errorEl.classList.add('visible');
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
